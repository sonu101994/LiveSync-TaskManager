<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>LiveSync Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-body">

    <!-- Centered Login Container -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <!-- Login Card -->
        <div class="auth-card p-4">

            <!-- App Title -->
            <h3 class="text-center mb-3">LiveSync</h3>

            <!-- Subtitle -->
            <p class="text-center text-secondary  mb-4">Manage your tasks efficiently</p>

            <!-- Email Input -->
            <input id="email" autocomplete="off" type="email" class="form-control mb-3" placeholder="Email">

            <!-- Password Input -->
            <input id="password" type="password" autocomplete="new-password" class="form-control mb-3" placeholder="Password">

            <!-- Login Button -->
            <button onclick="login()" class="btn btn-primary w-100 mb-2">
                Login
            </button>

            <!-- Register Redirect -->
            <p class="text-center mt-2">
                Don’t have an account?
                <a href="register.html" style="color:#6366f1; text-decoration:none;">
                    Register here
                </a>
            </p>

        </div>

    </div>

      <!-- Toast Message -->
    <div id="toast" class="toast-box"></div>

    <!--  Script -->
      <script src="./Js/api.js"></script>
    <script src="./Js/login.js"></script>

</body>

</html>

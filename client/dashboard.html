<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>LiveSync Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">

</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <header class="navbar-custom d-flex justify-content-between align-items-center px-4 py-3 position-sticky top-0 left-0">

        <h4 class="logo">
            <span class="logo-icon">
                <i class="bi bi-kanban"></i>
            </span>
            LiveSync
        </h4>

        <div class="d-flex align-items-center gap-3">

            <div class=" d-none d-sm-flex align-items-center gap-2 user-info">

                <div class="user-avatar" id="userAvatar">
                    S
                </div>

                <div id="userName" class="user-name">
                    User
                </div>

            </div>

            <button onclick="logout()" class="btn btn-outline-light btn-sm">
                Logout
            </button>

        </div>

    </header>

    <!-- Task Form -->
    <section class="container mt-4 px-3">

        <div class="row g-3 g-lg-2 align-items-center">

            <div class="col-sm-6 col-lg-3">
                <input id="taskInput" class="form-control" placeholder="Task title">
            </div>

            <div class="col-sm-6 col-lg-3">
                <input id="descInput" class="form-control" placeholder="Description">
            </div>

            
            <div class="col-sm-6 col-lg-2">

                <select
                    id="prioritySelect"
                    class="form-select priority-select"
                    onchange="selectPriority(this.value)"
                    style="color: #878EA3;"
                >
                    <option value="low">
                        Priority: Low
                    </option>

                    <option value="medium" selected>
                        Priority: Medium
                    </option>

                    <option value="high">
                        Priority: High
                    </option>
                </select>

            </div>

            <div class="col-sm-6 col-lg-2">
                <input id="dueDate" type="date" class="form-control" style="color: #878EA3;">
            </div>

            <div class="col ">
                <button onclick="createTask()" class="btn btn-primary w-100">
                    Add
                </button>
            </div>

        </div>

    </section>

    <!-- Board -->
    <section class="container-fluid my-4">

        <div class="row g-3 px-3">

            <div class="col-lg-3 col-md-6">
                <div class="kanban-column">
                    <h6 class="column-title">Backlog</h6>
                    <div id="backlog"></div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="kanban-column">
                    <h6 class="column-title">To Do</h6>
                    <div id="todo"></div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="kanban-column">
                    <h6 class="column-title">In Progress</h6>
                    <div id="inprogress"></div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="kanban-column">
                    <h6 class="column-title">Completed</h6>
                    <div id="completed"></div>
                </div>
            </div>

        </div>

    </section>

    <!-- Toast -->
    <div id="toast" class="toast-box"></div>

    <!-- confirm modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content livesync-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">confirm</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalMessage">
                    are you sure?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm" id="confirmActionBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- edit task modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content livesync-modal">
                <div class="modal-header">
                    <h5 class="modal-title">edit task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">task title</label>
                    <input id="editTaskTitle" class="form-control mb-3" placeholder="Task title">

                    <label class="form-label">description</label>
                    <textarea id="editTaskDescription" class="form-control modal-textarea" placeholder="Description"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" id="saveEditTaskBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- add user modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content livesync-modal">
                <div class="modal-header">
                    <h5 class="modal-title">assign user</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">user email</label>
                    <input id="addUserEmail" type="email" class="form-control" placeholder="Enter user email">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" id="saveAddUserBtn">Add User</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script src="./Js/api.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./Js/dashboard.js"></script>

</body>
</html>

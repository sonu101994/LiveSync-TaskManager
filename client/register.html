<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">

    <!-- Title -->
    <title>Register - LiveSync</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-body">

    <!-- Centered Register Card -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="auth-card p-4">

            <!-- Heading -->
            <h3 class="text-center mb-3">Register</h3>

            <!-- Username -->
            <input id="username" type="text" class="form-control mb-3" placeholder="Username" autocomplete="off">

            <!-- Email -->
            <input id="email" type="email" class="form-control mb-3" placeholder="Email" autocomplete="off">

            <!-- Password Field -->
            <div class="input-group mb-3">
                <input id="password" type="password" class="form-control" placeholder="Password" autocomplete="new-password">
                <span class="input-group-text" onclick="togglePassword('password')">
                    <i class="bi bi-eye-fill text-dark hover"></i>
                </span>
            </div>

            <!-- Confirm Password -->
            <div class="input-group mb-3">
                <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm Password" autocomplete="new-password">
                <span class="input-group-text" onclick="togglePassword('confirmPassword')">
                    <i class="bi bi-eye-fill text-dark hover"></i>
                </span>
            </div>

            <!-- Register Button -->
            <button onclick="register()" class="btn btn-primary w-100 mb-2">
                Register
            </button>

            <!-- Login Redirect -->
            <p class="text-center mt-2">
                Already have an account?
                <a href="index.html" style="color:#6366f1; text-decoration:none;">
                    Login here
                </a>
            </p>

        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast" class="toast-box"></div>

    <!-- Script -->
     <script src="./Js/api.js"></script>
    <script src="./Js/login.js"></script>

</body>

</html>
